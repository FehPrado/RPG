name: Compilar plugin

on:
  push:
  workflow_dispatch:
    inputs:
      subir_jar:
        description: Subir o jar compilado para a raiz da branch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Compila, roda os testes (src/test) e gera o jar.
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: RPGAtributos
          path: target/RPGAtributos-*.jar
      # Rodado à mão com "subir_jar" (ou num push com [jar] na mensagem): o jar vai para a raiz da branch (como os das versões anteriores).
      - if: (github.event_name == 'workflow_dispatch' && inputs.subir_jar) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[jar]'))
        run: |
          cp target/RPGAtributos-*.jar .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f RPGAtributos-*.jar
          git diff --cached --quiet || git commit -m "Jar $(ls target/RPGAtributos-*.jar | xargs -n1 basename)"
          git push
      # Tag "v2.36.0" (git tag v2.36.0 && git push origin v2.36.0): vira uma Release com o jar.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/RPGAtributos-*.jar
          generate_release_notes: true
