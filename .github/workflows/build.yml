name: Compilar plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Compila, roda os testes (src/test) e gera o jar.
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: RPGAtributos
          path: target/RPGAtributos-*.jar
      # Tag "v2.36.0" (git tag v2.36.0 && git push origin v2.36.0): vira uma Release com o jar.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/RPGAtributos-*.jar
          generate_release_notes: true
