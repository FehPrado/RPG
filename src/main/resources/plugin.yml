name: RPGAtributos
version: '${project.version}'
main: br.rpgatributos.RPGAtributos
api-version: '26.3'
description: Atributos RPG que evoluem com o uso, forja, arcano, chefes, plantações, cozinha, reciclagem, party, territórios, domador, masmorras, classes, lendas, pesca, alquimia, guarda-roupa, colônias, reinos, mundo vivo, portais e Torre Infinita.

commands:
  atributos:
    description: Mostra seus atributos (ou os de outro jogador).
    usage: /atributos [jogador] [chat]
    aliases: [atr, skills]
    permission: rpg.atributos
  rpgadmin:
    description: Comandos de administração do RPGAtributos.
    usage: /rpgadmin (use sem nada para ver a lista de subcomandos)
    permission: rpg.admin
  titulos:
    description: Abre seus títulos (conquistas que dão bônus).
    usage: /titulos
    aliases: [titulo]
    permission: rpg.titulos
  missoes:
    description: Mostra suas missões de aldeões.
    usage: /missoes
    aliases: [missao, pedidos]
    permission: rpg.missoes
  party:
    description: Party (grupo) — menu, convidar, sair, líder, fogo amigo.
    usage: /party [convidar|aceitar|recusar|sair|expulsar|lider|desfazer|chat|fogoamigo]
    aliases: [grupo, pt]
    permission: rpg.party
  pc:
    description: Manda uma mensagem só para a party (sem texto, liga/desliga o chat da party).
    usage: /pc [mensagem]
    aliases: [partychat]
    permission: rpg.party
  territorio:
    description: Seu território — menu, mapa, bordas, reivindicar, membros.
    usage: /territorio [mapa|bordas|info|reivindicar|liberar|adicionar|remover|abandonar]
    aliases: [terreno, territorios, claim]
    permission: rpg.territorio
  pets:
    description: Seus companheiros (domador) — onde estão, ordens e componentes.
    usage: /pets
    aliases: [companheiros, domador]
    permission: rpg.pets
  classe:
    description: A árvore de classes — seu caminho, tarefas, níveis e habilidades.
    usage: /classe
    aliases: [classes, job]
    permission: rpg.classe
  lendas:
    description: Livro das Lendas — itens Especiais únicos que nascem dos seus feitos.
    usage: /lendas
    aliases: [lenda, feitos]
    permission: rpg.lendas
  locais:
    description: Os Locais Ocultos que você já achou.
    usage: /locais
    aliases: [ocultos, explorar]
    permission: rpg.locais
  masmorra:
    description: Masmorras — informações e sair da masmorra em que você está.
    usage: /masmorra [sair]
    aliases: [masmorras, dungeon]
    permission: rpg.masmorra
  peixes:
    description: Diário do Pescador — peixes raros, tesouros e criaturas marinhas.
    usage: /peixes
    aliases: [pesca, diariodepesca]
    permission: rpg.pesca
  alquimia:
    description: Livro de Alquimia — elixires, componentes, gemas e acessórios.
    usage: /alquimia
    aliases: [elixires, gemas]
    permission: rpg.alquimia
  acessorios:
    description: Seus acessórios — anéis, amuletos, cintos e itens de bolso.
    usage: /acessorios
    aliases: [acessorio, aneis, bijuterias]
    permission: rpg.alquimia
  guardaroupa:
    description: Guarda-roupa — muda a aparência da armadura sem tirá-la.
    usage: /guardaroupa
    aliases: [roupas, wardrobe]
    permission: rpg.chapeu
  calendario:
    description: Estação do ano, fase da lua, clima e eventos do céu.
    usage: /calendario
    aliases: [estacao, clima, lua]
    permission: rpg.calendario
  maldicao:
    description: Sua maldição (lobisomem ou vampiro) — e transformar-se à noite.
    usage: /maldicao [transformar]
    aliases: [maldicoes, curse]
    permission: rpg.calendario
  combos:
    description: Combos de arma — proficiência e golpes nas sequências de 3 cliques.
    usage: /combos [arma]
    aliases: [combo, golpes]
    permission: rpg.combos
  mochila:
    description: Sua mochila — um baú pessoal que cresce com o nível total.
    usage: /mochila
    aliases: [bolsa, bp]
    permission: rpg.mochila
  deus:
    description: Sua fé — deus, devoção, oração e milagre.
    usage: /deus [milagre]
    aliases: [fe, deuses, milagre]
    permission: rpg.fe
  estrelas:
    description: Diário das Estrelas — as constelações que você já observou.
    usage: /estrelas
    aliases: [constelacoes, astronomia]
    permission: rpg.fe
  enciclopedia:
    description: Enciclopédia do Mundo — biomas, estruturas, itens e relíquias descobertos.
    usage: /enciclopedia
    aliases: [enc, descobertas]
    permission: rpg.exploracao
  cronista:
    description: As Crônicas do Mundo — a campanha do Cronista.
    usage: /cronista [entregar]
    aliases: [campanha, cronicas]
    permission: rpg.exploracao
  talentos:
    description: Árvore de talentos — pontos ganhos pelo nível total.
    usage: /talentos
    aliases: [talento, arvore]
    permission: rpg.progressao
  renascer:
    description: Renascer — atributos voltam a 0 com bônus permanente.
    usage: /renascer [confirmar]
    aliases: [renascimento, rebirth]
    permission: rpg.progressao
  rpg:
    description: Menu central do RPGAtributos (todos os sistemas).
    usage: /rpg
    aliases: [menu, rpgmenu]
    permission: rpg.atributos
  placar:
    description: Liga ou desliga o placar lateral.
    usage: /placar
    aliases: [scoreboard, sidebar]
    permission: rpg.atributos
  album:
    description: Álbum de Cartas.
    usage: /album
    aliases: [cartas]
    permission: rpg.vida
  segredos:
    description: Conquistas secretas.
    usage: /segredos
    aliases: [segredo, secretas]
    permission: rpg.vida
  sentar:
    description: Senta no chão (ou levanta).
    usage: /sentar
    aliases: [sit]
    permission: rpg.detalhes
  diario:
    description: Diário de Viagem — os marcos da sua jornada.
    usage: /diario
    aliases: [jornada, marcos]
    permission: rpg.detalhes
  recordes:
    description: Recordes do servidor.
    usage: /recordes
    aliases: [recorde, records]
    permission: rpg.detalhes
  portais:
    description: Portais abertos no mundo — onde estão e quando transbordam.
    usage: /portais
    aliases: [gates, portal]
    permission: rpg.portais
  sombras:
    description: O exército do Soberano das Sombras.
    usage: /sombras
    aliases: [exercito, shadows]
    permission: rpg.portais
  torre:
    description: Torre Infinita — ranking e sair da subida.
    usage: /torre [ranking|sair]
    aliases: [tower]
    permission: rpg.torre
  bestiario:
    description: Bestiário — monstros derrotados, marcos e a idade do mundo.
    usage: /bestiario
    aliases: [monstros, bestiary]
    permission: rpg.bestiario
  reino:
    description: Seu reino — cargos, tesouro e guerras entre jogadores.
    usage: /reino [fundar|convidar|aceitar|sair|cargo|coroa|tesouro|guerra|paz|lista]
    aliases: [reinos, kingdom]
    permission: rpg.reino
  colonia:
    description: Sua colônia — moradores, profissões, depósito e melhorias.
    usage: /colonia
    aliases: [colonias, vila, prefeitura]
    permission: rpg.colonia
  receitas:
    description: Mostra o livro de receitas da Cozinha.
    usage: /receitas
    aliases: [cozinha, pratos]
    permission: rpg.receitas
  guia:
    description: Dá o livro "Guia do Aventureiro", que explica como tudo funciona.
    usage: /guia
    aliases: [livroguia]
    permission: rpg.guia
  grimorio:
    description: Abre o grimório (suas magias, criador de magias e magias secretas).
    usage: /grimorio
    aliases: [magias]
    permission: rpg.arcano
  forja:
    description: Abre o guia da forja (raridades, chances e efeitos).
    usage: /forja
    aliases: [ferraria]
    permission: rpg.forja
  chapeu:
    description: Coloca o item da sua mão na cabeça.
    usage: /chapeu [tirar]
    aliases: [hat]
    permission: rpg.chapeu
  cosmeticos:
    description: Abre o menu de cosméticos (item na cabeça e tag).
    usage: /cosmeticos
    aliases: [cosmetico, visual]
    permission: rpg.chapeu
  tag:
    description: Troca o texto que aparece em cima da sua cabeça.
    usage: /tag <texto> | /tag remover
    permission: rpg.tag

permissions:
  rpg.atributos:
    default: true
  rpg.atributos.outros:
    default: true
  rpg.chapeu:
    default: true
  rpg.tag:
    default: true
  rpg.tag.cores:
    description: Permite usar cores (&a, &6...) na tag.
    default: true
  rpg.forja:
    default: true
  rpg.arcano:
    default: true
  rpg.guia:
    default: true
  rpg.titulos:
    default: true
  rpg.missoes:
    default: true
  rpg.receitas:
    default: true
  rpg.party:
    default: true
  rpg.territorio:
    default: true
  rpg.pets:
    default: true
  rpg.masmorra:
    default: true
  rpg.classe:
    default: true
  rpg.lendas:
    default: true
  rpg.locais:
    default: true
  rpg.pesca:
    default: true
  rpg.alquimia:
    default: true
  rpg.colonia:
    default: true
  rpg.reino:
    default: true
  rpg.bestiario:
    default: true
  rpg.calendario:
    default: true
  rpg.portais:
    default: true
  rpg.torre:
    default: true
  rpg.combos:
    default: true
  rpg.mochila:
    default: true
  rpg.fe:
    default: true
  rpg.exploracao:
    default: true
  rpg.progressao:
    default: true
  rpg.detalhes:
    default: true
  rpg.vida:
    default: true
  rpg.admin:
    default: op
