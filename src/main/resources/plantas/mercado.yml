# Projeto de construção da colônia (Mercado).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Mercado"
descricao:
  - "Loja com a mesa de cartografia"
  - "e os baús do Mercador."
icone: EMERALD
nivel: 2
efeito: MERCADO
legenda:
  "P": "stone_bricks"
  "L": "dark_oak_log"
  "T": "oak_planks"
  "J": "glass_pane"
  "D": "dark_oak_door[facing=north,half=lower,hinge=left]"
  "d": "dark_oak_door[facing=north,half=upper,hinge=left]"
  "N": "lantern[hanging=false]"
  "W": "wall_torch[facing=north]"
  "E": "dark_oak_stairs[facing=east,half=bottom]"
  "Q": "dark_oak_stairs[facing=west,half=bottom]"
  "S": "dark_oak_slab[type=bottom]"
  "M": "cartography_table"
  "C": "chest[facing=south]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      cartography_table: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      cartography_table: 1
      chest: 2
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      cartography_table: 2
      chest: 2
camadas:
  # 0
  - - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
