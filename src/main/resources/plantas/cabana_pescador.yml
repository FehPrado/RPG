    - "T.....T"
    - "J.....J"
    - "T.....T"
    - "T.....T"
    - "LTTdTTL"
  # 3
  - - "LTTTTTL"
    - "T.....T"
    - "T.....T"
    - "T.....T"
    - "T.....T"
    - "T..W..T"
    - "LTTTTTL"
  # 4
  - - "ETTTTTQ"
    - "E.....Q"
