# Projeto de construção da colônia (Cabana do Pescador).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Cabana do Pescador"
descricao:
  - "Cabana de bétula com o barril do Pescador."
  - "Construa perto da água."
icone: FISHING_ROD
nivel: 1
efeito: CABANA_PESCADOR
legenda:
  "P": "cobblestone"
  "L": "birch_log"
  "T": "birch_planks"
  "J": "glass_pane"
  "D": "birch_door[facing=north,half=lower,hinge=left]"
  "d": "birch_door[facing=north,half=upper,hinge=left]"
  "N": "lantern[hanging=false]"
  "W": "wall_torch[facing=north]"
  "E": "birch_stairs[facing=east,half=bottom]"
  "Q": "birch_stairs[facing=west,half=bottom]"
  "S": "birch_slab[type=bottom]"
  "R": "barrel[facing=up]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      barrel: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      barrel: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      barrel: 2
camadas:
  # 0
  - - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
