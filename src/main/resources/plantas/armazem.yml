# Projeto de construção da colônia (Armazém).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Armazém"
descricao:
  - "Galpão de abeto com 7 baús."
  - "Pronto, os baús viram depósito da colônia."
icone: CHEST
nivel: 2
efeito: ARMAZEM
legenda:
  "P": "stone_bricks"
  "L": "spruce_log"
  "T": "spruce_planks"
  "J": "glass_pane"
  "D": "spruce_door[facing=north,half=lower,hinge=left]"
  "d": "spruce_door[facing=north,half=upper,hinge=left]"
  "K": "chest[facing=south]"
  "k": "chest[facing=east]"
  "R": "chest[facing=west]"
  "N": "lantern[hanging=false]"
  "n": "lantern[hanging=true]"
  "E": "spruce_stairs[facing=east,half=bottom]"
  "Q": "spruce_stairs[facing=west,half=bottom]"
  "S": "spruce_slab[type=bottom]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 50
    baus: 4
    portas: 1
    luz: 1
    coberto: 70
  - blocos: 90
    baus: 10
    portas: 1
    luz: 2
    coberto: 80
  - blocos: 150
    baus: 16
    portas: 1
    luz: 3
    coberto: 85
camadas:
  # 0
  - - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
