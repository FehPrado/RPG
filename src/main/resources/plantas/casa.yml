  "P": "cobblestone"
  "L": "oak_log"
  "T": "oak_planks"
  "J": "glass_pane"
  "D": "oak_door[facing=north,half=lower,hinge=left]"
  "d": "oak_door[facing=north,half=upper,hinge=left]"
  "H": "red_bed[facing=north,part=head]"
  "F": "red_bed[facing=north,part=foot]"
  "N": "lantern[hanging=false]"
  "W": "wall_torch[facing=north]"
  "E": "oak_stairs[facing=east,half=bottom]"
  "Q": "oak_stairs[facing=west,half=bottom]"
  "S": "oak_slab[type=bottom]"
