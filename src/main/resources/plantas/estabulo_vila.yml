# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Estábulo"
descricao:
  - "Celeiro com baias, portão grande, sótão de feno"
  - "e cocho. Faça o Altar do Domador num fardo."
icone: HAY_BLOCK
nivel: 3
efeito: ESTABULO
legenda:
  "A": "grass_block"
  "B": "coarse_dirt"
  "C": "dirt_path"
  "D": "mossy_cobblestone"
  "E": "cobblestone"
  "F": "hay_block[axis=y]"
  "G": "water_cauldron[level=3]"
  "H": "spruce_fence"
  "I": "composter[level=0]"
  "J": "spruce_fence_gate[facing=east,open=false]"
  "K": "spruce_fence_gate[facing=west,open=false]"
  "L": "spruce_trapdoor[facing=east,half=top,open=false]"
  "M": "ladder[facing=north]"
  "N": "spruce_fence_gate[facing=south,open=false]"
  "O": "spruce_door[facing=north,half=lower,hinge=left]"
  "P": "dark_oak_log[axis=y]"
  "Q": "spruce_planks"
  "R": "spruce_door[facing=north,half=upper,hinge=left]"
  "S": "spruce_trapdoor[facing=west,half=bottom,open=true]"
  "T": "spruce_trapdoor[facing=east,half=bottom,open=true]"
  "U": "dark_oak_stairs[facing=west,half=top]"
  "V": "dark_oak_stairs[facing=east,half=top]"
  "W": "lantern[hanging=true]"
  "X": "dark_oak_log[axis=x]"
  "Y": "dark_oak_stairs[facing=east,half=bottom]"
  "Z": "dark_oak_stairs[facing=west,half=bottom]"
  "a": "hay_block[axis=x]"
  "b": "chest[facing=south]"
  "c": "dark_oak_planks"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      hay_block: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      hay_block: 1
      chest: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      hay_block: 2
      chest: 1
