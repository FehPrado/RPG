# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Cabana do Lenhador"
descricao:
  - "Cabana de troncos com telheiro, pilha de toras"
  - "e a bancada de flechas do Lenhador."
icone: FLETCHING_TABLE
nivel: 1
efeito: CABANA_LENHADOR
legenda:
  "A": "grass_block"
  "B": "spruce_planks"
  "C": "dirt_path"
  "D": "cobblestone"
  "E": "stripped_spruce_log[axis=y]"
  "F": "spruce_log[axis=x]"
  "G": "spruce_fence"
  "H": "spruce_log[axis=z]"
  "I": "fletching_table"
  "J": "chest[facing=south]"
  "K": "grindstone[face=floor,facing=south]"
  "L": "oak_log[axis=x]"
  "M": "birch_log[axis=x]"
  "N": "brown_bed[facing=north,part=head]"
  "O": "brown_bed[facing=north,part=foot]"
  "P": "barrel[facing=up]"
  "Q": "spruce_door[facing=north,half=lower,hinge=left]"
  "R": "stripped_oak_log[axis=y]"
  "S": "glass_pane"
  "T": "spruce_door[facing=north,half=upper,hinge=left]"
  "U": "spruce_trapdoor[facing=south,half=bottom,open=true]"
  "V": "spruce_slab[type=bottom]"
  "W": "lantern[hanging=true]"
  "X": "spruce_stairs[facing=west,half=top]"
  "Y": "spruce_stairs[facing=east,half=bottom]"
  "Z": "spruce_stairs[facing=west,half=bottom]"
  "a": "campfire[lit=true,signal_fire=false,facing=north]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      fletching_table: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      fletching_table: 1
      chest: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      fletching_table: 2
      chest: 1
