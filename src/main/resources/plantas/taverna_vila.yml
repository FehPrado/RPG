# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Taverna"
descricao:
  - "Taverna de 2 andares com balcão de barris,"
  - "mesas, lareira e quartos em cima."
icone: SMOKER
nivel: 2
efeito: TAVERNA
legenda:
  "A": "grass_block"
  "B": "spruce_planks"
  "C": "mossy_cobblestone"
  "D": "cobblestone"
  "E": "barrel[facing=south]"
  "F": "campfire[lit=true,signal_fire=false,facing=west]"
  "G": "smoker[facing=north,lit=false]"
  "H": "spruce_stairs[facing=east,half=bottom]"
  "I": "spruce_fence"
  "J": "spruce_stairs[facing=west,half=bottom]"
  "K": "spruce_stairs[facing=north,half=bottom]"
  "L": "dark_oak_door[facing=north,half=lower,hinge=left]"
  "M": "dark_oak_log[axis=y]"
  "N": "birch_planks"
  "O": "glass_pane"
  "P": "spruce_pressure_plate"
  "Q": "lantern[hanging=false]"
  "R": "dark_oak_door[facing=north,half=upper,hinge=left]"
  "S": "spruce_trapdoor[facing=south,half=bottom,open=true]"
  "T": "oak_hanging_sign[rotation=0,attached=false]"
  "U": "lantern[hanging=true]"
  "V": "dark_oak_log[axis=x]"
  "W": "dark_oak_log[axis=z]"
  "X": "spruce_stairs[facing=north,half=top]"
  "Y": "green_bed[facing=north,part=head]"
  "Z": "chest[facing=south]"
  "a": "yellow_bed[facing=north,part=head]"
  "b": "green_bed[facing=north,part=foot]"
  "c": "yellow_bed[facing=north,part=foot]"
  "d": "green_carpet"
  "e": "dark_oak_stairs[facing=west,half=top]"
  "f": "dark_oak_stairs[facing=east,half=top]"
  "g": "dark_oak_stairs[facing=east,half=bottom]"
  "h": "dark_oak_stairs[facing=west,half=bottom]"
  "i": "campfire[lit=true,signal_fire=false,facing=north]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      smoker: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      smoker: 1
      chest: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      smoker: 2
      chest: 1
