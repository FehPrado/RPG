# Projeto de construção da colônia (Mina).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Mina"
descricao:
  - "Casa de pedra com o cortador de pedras"
  - "e o baú do Minerador."
icone: IRON_PICKAXE
nivel: 2
efeito: MINA
legenda:
  "P": "cobblestone"
  "L": "stone_bricks"
  "T": "cobblestone"
  "J": "glass_pane"
  "D": "spruce_door[facing=north,half=lower,hinge=left]"
  "d": "spruce_door[facing=north,half=upper,hinge=left]"
  "N": "lantern[hanging=false]"
  "W": "wall_torch[facing=north]"
  "E": "stone_brick_stairs[facing=east,half=bottom]"
  "Q": "stone_brick_stairs[facing=west,half=bottom]"
  "S": "stonecutter[facing=south]"
  "C": "chest[facing=south]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      stonecutter: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      stonecutter: 1
      chest: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      stonecutter: 2
      chest: 1
camadas:
  # 0
  - - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
    - "PPPPPPP"
