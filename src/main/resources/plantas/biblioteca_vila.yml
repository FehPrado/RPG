# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Biblioteca"
descricao:
  - "Salão de 2 andares com estantes até o teto,"
  - "mezanino e 3 atris para o Bibliotecário."
icone: BOOKSHELF
nivel: 2
efeito: BIBLIOTECA
legenda:
  "A": "grass_block"
  "B": "stone_bricks"
  "C": "spruce_planks"
  "D": "dark_oak_planks"
  "E": "bookshelf"
  "F": "dark_oak_stairs[facing=east,half=bottom]"
  "G": "dark_oak_fence"
  "H": "dark_oak_stairs[facing=west,half=bottom]"
  "I": "lectern[facing=south,has_book=false]"
  "J": "red_carpet"
  "K": "spruce_stairs[facing=north,half=bottom]"
  "L": "dark_oak_door[facing=north,half=lower,hinge=left]"
  "M": "dark_oak_log[axis=y]"
  "N": "white_terracotta"
  "O": "glass_pane"
  "P": "dark_oak_pressure_plate"
  "Q": "dark_oak_door[facing=north,half=upper,hinge=left]"
  "R": "chiseled_stone_bricks"
  "S": "lantern[hanging=true]"
  "T": "dark_oak_log[axis=x]"
  "U": "dark_oak_log[axis=z]"
  "V": "candle[candles=3,lit=true]"
  "W": "spruce_fence"
  "X": "deepslate_tile_stairs[facing=west,half=top]"
  "Y": "deepslate_tile_stairs[facing=east,half=top]"
  "Z": "iron_chain[axis=y]"
  "a": "deepslate_tile_stairs[facing=east,half=bottom]"
  "b": "deepslate_tile_stairs[facing=west,half=bottom]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 80
    portas: 1
    luz: 1
    coberto: 70
    itens:
      lectern: 1
      bookshelf: 10
  - blocos: 120
    portas: 1
    luz: 2
    coberto: 80
    itens:
      lectern: 2
      bookshelf: 24
  - blocos: 200
    portas: 1
    luz: 4
    coberto: 85
    itens:
      lectern: 3
      bookshelf: 40
