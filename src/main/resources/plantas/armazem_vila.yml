# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Armazém"
descricao:
  - "Galpão grande com portão duplo e prateleiras"
  - "de baús e barris: viram depósito da colônia."
icone: CHEST
nivel: 2
efeito: ARMAZEM
legenda:
  "A": "grass_block"
  "B": "stone_bricks"
  "C": "spruce_planks"
  "D": "dirt_path"
  "E": "mossy_cobblestone"
  "F": "cobblestone"
  "G": "chest[facing=east]"
  "H": "chest[facing=south]"
  "I": "chest[facing=west]"
  "J": "barrel[facing=east]"
  "K": "barrel[facing=west]"
  "L": "hay_block[axis=x]"
  "M": "hay_block[axis=y]"
  "N": "spruce_door[facing=north,half=lower,hinge=left]"
  "O": "spruce_door[facing=north,half=lower,hinge=right]"
  "P": "barrel[facing=up]"
  "Q": "spruce_door[facing=north,half=upper,hinge=left]"
  "R": "spruce_door[facing=north,half=upper,hinge=right]"
  "S": "dark_oak_log[axis=y]"
  "T": "spruce_slab[type=bottom]"
  "U": "glass_pane"
  "V": "lantern[hanging=true]"
  "W": "dark_oak_log[axis=x]"
  "X": "dark_oak_stairs[facing=west,half=top]"
  "Y": "dark_oak_stairs[facing=east,half=top]"
  "Z": "dark_oak_stairs[facing=east,half=bottom]"
  "a": "dark_oak_stairs[facing=west,half=bottom]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 50
    baus: 4
    portas: 1
    luz: 1
    coberto: 70
  - blocos: 90
    baus: 10
    portas: 1
    luz: 2
    coberto: 80
  - blocos: 150
    baus: 16
    portas: 1
    luz: 3
    coberto: 85
