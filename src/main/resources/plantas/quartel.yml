# Projeto de construção da colônia (Quartel).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Quartel"
descricao:
  - "Alojamento de pedra com 4 camas"
  - "e 2 alvos (8 vagas de soldado)."
icone: TARGET
nivel: 2
efeito: QUARTEL
legenda:
  "P": "stone_bricks"
  "C": "cobblestone"
  "L": "spruce_log"
  "H": "red_bed[facing=north,part=head]"
  "F": "red_bed[facing=north,part=foot]"
  "A": "target"
  "J": "glass_pane"
  "D": "spruce_door[facing=north,half=lower,hinge=left]"
  "d": "spruce_door[facing=north,half=upper,hinge=left]"
  "N": "lantern[hanging=false]"
  "M": "cobblestone_wall"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 70
    camas: 2
    portas: 1
    luz: 1
    coberto: 70
    itens:
      target: 1
  - blocos: 120
    camas: 4
    portas: 1
    luz: 2
    coberto: 80
    itens:
      target: 2
  - blocos: 200
    camas: 6
    portas: 1
    luz: 3
    coberto: 85
    itens:
      target: 4
