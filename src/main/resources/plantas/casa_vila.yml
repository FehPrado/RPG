# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Casa"
descricao:
  - "Sobrado de enxaimel com 4 camas, lareira,"
  - "varanda coberta e chaminé."
icone: OAK_DOOR
nivel: 1
efeito: CASA
legenda:
  "A": "grass_block"
  "B": "spruce_planks"
  "C": "dirt_path"
  "D": "mossy_cobblestone"
  "E": "cobblestone"
  "F": "campfire[lit=true,signal_fire=false,facing=south]"
  "G": "crafting_table"
  "H": "furnace[facing=south]"
  "I": "spruce_stairs[facing=south,half=bottom]"
  "J": "spruce_stairs[facing=east,half=bottom]"
  "K": "spruce_fence"
  "L": "spruce_stairs[facing=west,half=bottom]"
  "M": "chest[facing=east]"
  "N": "barrel[facing=up]"
  "O": "red_carpet"
  "P": "spruce_door[facing=north,half=lower,hinge=left]"
  "Q": "potted_red_tulip"
  "R": "dark_oak_log[axis=y]"
  "S": "birch_planks"
  "T": "glass_pane"
  "U": "spruce_pressure_plate"
  "V": "spruce_door[facing=north,half=upper,hinge=left]"
  "W": "lantern[hanging=true]"
  "X": "dark_oak_log[axis=x]"
  "Y": "dark_oak_log[axis=z]"
  "Z": "spruce_slab[type=bottom]"
  "a": "red_bed[facing=north,part=head]"
  "b": "red_bed[facing=north,part=foot]"
  "c": "white_carpet"
  "d": "blue_bed[facing=north,part=head]"
  "e": "blue_bed[facing=north,part=foot]"
  "f": "chest[facing=west]"
  "g": "dark_oak_stairs[facing=west,half=top]"
  "h": "dark_oak_stairs[facing=east,half=top]"
  "i": "spruce_trapdoor[facing=south,half=bottom,open=true]"
  "j": "dark_oak_stairs[facing=east,half=bottom]"
  "k": "dark_oak_stairs[facing=west,half=bottom]"
  "l": "campfire[lit=true,signal_fire=false,facing=north]"
  "m": "dark_oak_planks"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    camas: 2
    portas: 1
    luz: 1
    coberto: 70
  - blocos: 90
    camas: 4
    portas: 1
    luz: 2
    coberto: 80
  - blocos: 150
    camas: 6
    portas: 2
    luz: 4
    coberto: 85
