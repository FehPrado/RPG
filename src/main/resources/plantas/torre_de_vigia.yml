# Projeto de construção da colônia (Torre de Vigia).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Torre de Vigia"
descricao:
  - "Torre de pedra com escada e mirante."
  - "Pronta, o território cresce em volta dela."
icone: SPYGLASS
nivel: 1
efeito: TORRE_DE_VIGIA
legenda:
  "C": "cobblestone"
  "S": "stone_bricks"
  "H": "ladder[facing=south]"
  "D": "spruce_door[facing=north,half=lower,hinge=left]"
  "d": "spruce_door[facing=north,half=upper,hinge=left]"
  "W": "wall_torch[facing=north]"
  "T": "spruce_planks"
  "M": "stone_brick_wall"
  "N": "lantern[hanging=false]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 80
    altura: 9
    luz: 1
    itens:
      ladder: 6
  - blocos: 150
    altura: 14
    luz: 2
    itens:
      ladder: 10
  - blocos: 240
    altura: 20
    luz: 4
    itens:
      ladder: 16
camadas:
