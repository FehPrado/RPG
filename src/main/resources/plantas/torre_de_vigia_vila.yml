# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Torre de Vigia"
descricao:
  - "Torre de pedra e enxaimel com sacada, sino"
  - "e telhado pontudo. Aumenta o território."
icone: SPYGLASS
nivel: 1
efeito: TORRE_DE_VIGIA
legenda:
  "A": "grass_block"
  "B": "stone_bricks"
  "C": "cracked_stone_bricks"
  "D": "mossy_stone_bricks"
  "E": "ladder[facing=south]"
  "F": "spruce_door[facing=north,half=lower,hinge=left]"
  "G": "spruce_door[facing=north,half=upper,hinge=left]"
  "H": "glass_pane"
  "I": "dark_oak_log[axis=y]"
  "J": "birch_planks"
  "K": "spruce_stairs[facing=south,half=top]"
  "L": "spruce_stairs[facing=east,half=top]"
  "M": "spruce_stairs[facing=west,half=top]"
  "N": "spruce_stairs[facing=north,half=top]"
  "O": "lantern[hanging=true]"
  "P": "spruce_planks"
  "Q": "spruce_trapdoor[facing=south,half=top,open=false]"
  "R": "spruce_fence"
  "S": "bell[attachment=floor,facing=south]"
  "T": "dark_oak_stairs[facing=south,half=bottom,shape=outer_right]"
  "U": "dark_oak_stairs[facing=south,half=bottom]"
  "V": "dark_oak_stairs[facing=south,half=bottom,shape=outer_left]"
  "W": "dark_oak_stairs[facing=east,half=bottom]"
  "X": "dark_oak_stairs[facing=west,half=bottom]"
  "Y": "dark_oak_planks"
  "Z": "dark_oak_stairs[facing=north,half=bottom,shape=outer_left]"
  "a": "dark_oak_stairs[facing=north,half=bottom]"
  "b": "dark_oak_stairs[facing=north,half=bottom,shape=outer_right]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 80
    altura: 9
    luz: 1
    itens:
      ladder: 6
  - blocos: 150
    altura: 14
    luz: 2
    itens:
      ladder: 10
  - blocos: 240
    altura: 20
    luz: 4
    itens:
      ladder: 16
