# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Cabana do Pescador"
descricao:
  - "Palafita com deque, barris e varal de peixe."
  - "Construa perto da água."
icone: FISHING_ROD
nivel: 1
efeito: CABANA_PESCADOR
legenda:
  "A": "grass_block"
  "B": "spruce_log[axis=y]"
  "C": "spruce_planks"
  "D": "spruce_stairs[facing=north,half=bottom]"
  "E": "birch_planks"
  "F": "barrel[facing=up]"
  "G": "chest[facing=south]"
  "H": "cyan_bed[facing=north,part=head]"
  "I": "cyan_bed[facing=north,part=foot]"
  "J": "cyan_carpet"
  "K": "spruce_door[facing=north,half=lower,hinge=left]"
  "L": "spruce_fence"
  "M": "cauldron"
  "N": "glass_pane"
  "O": "spruce_door[facing=north,half=upper,hinge=left]"
  "P": "lantern[hanging=false]"
  "Q": "spruce_stairs[facing=west,half=top]"
  "R": "spruce_stairs[facing=east,half=top]"
  "S": "lantern[hanging=true]"
  "T": "spruce_stairs[facing=east,half=bottom]"
  "U": "spruce_stairs[facing=west,half=bottom]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      barrel: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      barrel: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      barrel: 2
