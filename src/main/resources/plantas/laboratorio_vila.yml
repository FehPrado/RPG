# Projeto de construção da colônia (estilo vila, 2.90).
# Camadas de baixo (0 = chão) para cima. Em cada camada a 1ª linha é o FUNDO e a última é a FRENTE (entrada).
# Na legenda, "south" é o lado da entrada. '.' = ar (o Construtor limpa) e '~' = não mexe.
nome: "Laboratório"
descricao:
  - "Laboratório de ardósia com torrinha de cobre,"
  - "suportes de poções e jardim de ervas."
icone: BREWING_STAND
nivel: 4
efeito: LABORATORIO
legenda:
  "A": "grass_block"
  "B": "polished_deepslate"
  "C": "deepslate_tiles"
  "D": "moss_block"
  "E": "dirt_path"
  "F": "dark_oak_log[axis=y]"
  "G": "deepslate_bricks"
  "H": "dark_oak_planks"
  "I": "brewing_stand"
  "J": "cauldron"
  "K": "chest[facing=east]"
  "L": "chiseled_bookshelf[facing=east]"
  "M": "enchanting_table"
  "N": "barrel[facing=east]"
  "O": "lectern[facing=west,has_book=false]"
  "P": "purple_carpet"
  "Q": "crimson_door[facing=north,half=lower,hinge=left]"
  "R": "flowering_azalea"
  "S": "allium"
  "T": "azure_bluet"
  "U": "lily_of_the_valley"
  "V": "cornflower"
  "W": "azalea"
  "X": "cracked_deepslate_bricks"
  "Y": "purple_stained_glass_pane"
  "Z": "potted_red_mushroom"
  "a": "potted_brown_mushroom"
  "b": "bookshelf"
  "c": "crimson_door[facing=north,half=upper,hinge=left]"
  "d": "amethyst_cluster[facing=down]"
  "e": "deepslate_tile_stairs[facing=west,half=top]"
  "f": "deepslate_tile_stairs[facing=east,half=top]"
  "g": "soul_lantern[hanging=true]"
  "h": "amethyst_block"
  "i": "deepslate_tile_stairs[facing=east,half=bottom]"
  "j": "deepslate_tile_stairs[facing=west,half=bottom]"
  "k": "waxed_cut_copper"
  "l": "waxed_cut_copper_slab[type=bottom]"
  "m": "waxed_copper_block"
  "n": "lightning_rod[facing=up]"
# Níveis: o mínimo de cada nível (o 1º é o que precisa ter quem constrói do seu jeito).
# blocos = blocos firmes construídos; coberto = % do piso com teto; altura = do chão até o bloco mais alto.
niveis:
  - blocos: 40
    portas: 1
    luz: 1
    coberto: 70
    itens:
      brewing_stand: 1
  - blocos: 80
    portas: 1
    luz: 2
    coberto: 80
    itens:
      brewing_stand: 1
      cauldron: 1
  - blocos: 140
    portas: 1
    luz: 3
    coberto: 85
    itens:
      brewing_stand: 2
      cauldron: 1
